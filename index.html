<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SanaNeke — Саналы некеге қадам</title>
  <meta name="description" content="SanaNeke — Психологиялық және қаржылық дайындықты превентивті бағалау платформасы"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{font-family:'Inter',sans-serif;}
    html{scroll-behavior:smooth;}

    /* ── Backgrounds ── */
    .hero-gradient{background:linear-gradient(135deg,#0f1f5c 0%,#1E3A8A 40%,#0e5f80 100%);}
    .auth-gradient{background:linear-gradient(135deg,#0f1f5c 0%,#1E3A8A 50%,#0e5f80 100%);}

    /* ── Glassmorphism ── */
    .glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.18);}
    .glass-white{background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);}

    /* ── Animations ── */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes slideInRight{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
    @keyframes popIn{from{opacity:0;transform:scale(0.88);}to{opacity:1;transform:scale(1);}}
    @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(200%);}}
    @keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,0.4);}50%{box-shadow:0 0 0 8px rgba(6,182,212,0);}}
    @keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:1;}90%{opacity:.6;}100%{transform:translateY(-10vh) scale(1.2);opacity:0;}}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
    @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

    .animate-fadeInUp{animation:fadeInUp .5s ease both;}
    .animate-fadeIn{animation:fadeIn .4s ease both;}
    .animate-slideInRight{animation:slideInRight .4s ease both;}
    .animate-popIn{animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) both;}
    .floating-badge{animation:bob 3s ease-in-out infinite;}

    /* ── Particles ── */
    .particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
    .particle{position:absolute;border-radius:50%;background:rgba(6,182,212,.25);animation:float linear infinite;}

    /* ── Buttons ── */
    .btn-primary{background:linear-gradient(135deg,#1E3A8A,#2563eb);color:#fff;font-weight:700;padding:12px 28px;border-radius:50px;border:none;cursor:pointer;transition:all .3s;box-shadow:0 6px 20px rgba(30,58,138,.35);}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(30,58,138,.5);}
    .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;}
    .btn-cyan{background:linear-gradient(135deg,#06B6D4,#0891b2);color:#fff;font-weight:700;padding:12px 28px;border-radius:50px;border:none;cursor:pointer;transition:all .3s;box-shadow:0 6px 20px rgba(6,182,212,.35);}
    .btn-cyan:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(6,182,212,.5);}
    .btn-ghost{background:transparent;color:#1E3A8A;font-weight:600;padding:10px 24px;border-radius:50px;border:2px solid #1E3A8A;cursor:pointer;transition:all .3s;}
    .btn-ghost:hover{background:#1E3A8A;color:#fff;}
    .btn-sm{padding:8px 18px;font-size:.85rem;border-radius:30px;}
    .btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-weight:600;padding:8px 18px;border-radius:30px;border:none;cursor:pointer;transition:all .3s;}
    .btn-danger:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(220,38,38,.4);}
    .btn-green{background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-weight:600;padding:8px 18px;border-radius:30px;border:none;cursor:pointer;transition:all .3s;}
    .btn-green:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(5,150,105,.4);}

    /* ── Form inputs ── */
    .inp{border:2px solid #e2e8f0;border-radius:12px;padding:11px 16px;width:100%;font-size:.95rem;transition:border-color .2s,box-shadow .2s;outline:none;background:#fff;color:#1e293b;}
    .inp:focus{border-color:#06B6D4;box-shadow:0 0 0 3px rgba(6,182,212,.12);}
    select.inp{cursor:pointer;}
    .inp-label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}

    /* ── Likert ── */
    .likert-btn{transition:all .18s ease;cursor:pointer;border:2px solid #cbd5e1;background:#fff;border-radius:10px;width:48px;height:48px;font-weight:700;color:#64748b;font-size:.95rem;}
    .likert-btn:hover{border-color:#06B6D4;background:#ecfeff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(6,182,212,.2);}
    .likert-btn.selected{border-color:#1E3A8A;background:linear-gradient(135deg,#1E3A8A,#06B6D4);color:#fff;transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,58,138,.35);}

    /* ── Cards ── */
    .card{background:#fff;border-radius:20px;box-shadow:0 2px 16px rgba(0,0,0,.06);border:1px solid #f1f5f9;transition:box-shadow .3s,transform .3s;}
    .card:hover{box-shadow:0 8px 32px rgba(30,58,138,.1);transform:translateY(-2px);}
    .card-flat{background:#fff;border-radius:16px;box-shadow:0 1px 8px rgba(0,0,0,.05);border:1px solid #f1f5f9;}

    /* ── Progress bar ── */
    .pbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#1E3A8A,#06B6D4);transition:width 1s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
    .pbar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite;}

    /* ── Ring score ── */
    .score-ring{position:relative;width:150px;height:150px;}
    .score-ring svg{transform:rotate(-90deg);}
    .score-ring .ring-bg{fill:none;stroke:#e2e8f0;stroke-width:10;}
    .score-ring .ring-fill{fill:none;stroke-width:10;stroke-linecap:round;stroke:url(#rg);stroke-dasharray:408;stroke-dashoffset:408;transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);}
    .score-ring .score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

    /* ── Tab bar ── */
    .tab-bar{background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 8px rgba(0,0,0,.06);}
    .tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;border:none;background:transparent;cursor:pointer;color:#94a3b8;font-size:.7rem;font-weight:600;transition:color .2s;border-bottom:3px solid transparent;white-space:nowrap;min-width:60px;}
    .tab-btn.active{color:#1E3A8A;border-bottom-color:#1E3A8A;}
    .tab-btn .tab-icon{font-size:1.3rem;line-height:1;}
    .tab-content{display:none;}
    .tab-content.active{display:block;}

    /* ── Role badge ── */
    .role-user{background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;}
    .role-psych{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;}

    /* ── Risk badge ── */
    .risk-high{background:#fee2e2;color:#b91c1c;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;}
    .risk-med{background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;}
    .risk-low{background:#d1fae5;color:#065f46;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;}

    /* ── Rec cards ── */
    .rec-high{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border-left:5px solid #059669;}
    .rec-med{background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:5px solid #d97706;}
    .rec-low{background:linear-gradient(135deg,#fee2e2,#fecaca);border-left:5px solid #dc2626;}

    /* ── Category progress ── */
    .cat-pill{display:inline-flex;align-items:center;gap:6px;background:#f0f6ff;border-radius:30px;padding:6px 14px;font-size:.8rem;font-weight:600;color:#1E3A8A;}

    /* ── Overlay ── */
    #auth-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;}

    /* ── Confetti ── */
    .confetti-piece{position:fixed;pointer-events:none;z-index:99999;animation:confettiFall linear forwards;}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-track{background:#f1f5f9;}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:#94a3b8;}

    /* ── Range slider ── */
    input[type=range]{-webkit-appearance:none;height:6px;border-radius:999px;background:linear-gradient(90deg,#06B6D4 var(--val,50%),#e2e8f0 var(--val,50%));outline:none;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#1E3A8A;box-shadow:0 2px 6px rgba(30,58,138,.4);transition:transform .2s;}
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2);}

    /* ── Toast ── */
    #toast{position:fixed;bottom:24px;right:24px;z-index:99998;transform:translateX(120%);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);}
    #toast.show{transform:translateX(0);}

    /* Mobile adjustments */
    @media(max-width:480px){
      .tab-btn{min-width:52px;padding:8px 8px;font-size:.65rem;}
      .likert-btn{width:40px;height:40px;font-size:.85rem;}
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ════════════════════════════════════
     AUTH OVERLAY
════════════════════════════════════ -->
<div id="auth-overlay" class="auth-gradient">
  <!-- Particles -->
  <div class="particles" id="auth-particles"></div>
  <!-- Blobs -->
  <div class="absolute top-10 right-10 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 left-10 w-80 h-80 bg-blue-400/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-md mx-auto px-4">

    <!-- Logo -->
    <div class="text-center mb-8 animate-fadeInUp">
      <div class="floating-badge inline-flex items-center gap-2 glass text-cyan-300 text-sm font-medium px-5 py-2 rounded-full mb-6">
        <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
        Қазақстандағы ажырасуды азайту жобасы
      </div>
      <h1 class="text-5xl font-black text-white mb-2">
        Sana<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-sky-300">Neke</span>
      </h1>
      <p class="text-blue-200 text-sm">Саналы некеге қадам</p>
    </div>

    <!-- Auth Card -->
    <div class="glass-white rounded-3xl p-8 shadow-2xl animate-fadeInUp" style="animation-delay:.15s">

      <!-- Landing Buttons -->
      <div id="auth-landing">
        <h2 class="text-2xl font-black text-slate-800 mb-2 text-center">Қош келдіңіз!</h2>
        <p class="text-slate-500 text-center text-sm mb-8">Платформаны пайдалану үшін кіріңіз немесе тіркеліңіз</p>
        <div class="flex flex-col gap-3">
          <button class="btn-primary w-full py-3 text-base" onclick="showAuthForm('login')">🔑 Кіру (Войти)</button>
          <button class="btn-cyan w-full py-3 text-base" onclick="showAuthForm('register')">✨ Тіркелу (Регистрация)</button>
        </div>
        <!-- Demo hint -->
        <div class="mt-6 p-3 bg-blue-50 rounded-xl text-xs text-blue-700 text-center">
          💡 <strong>Демо:</strong> user@demo.kz / psych@demo.kz — пароль: <strong>demo123</strong>
        </div>
      </div>

      <!-- Login Form -->
      <div id="auth-login" style="display:none">
        <div class="flex items-center gap-3 mb-6">
          <button onclick="showAuthForm('landing')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors">←</button>
          <h2 class="text-xl font-black text-slate-800">Кіру</h2>
        </div>
        <div class="space-y-4">
          <div>
            <label class="inp-label">Email</label>

      </div>

      <!-- Register Form -->
      <div id="auth-register" style="display:none">
        <div class="flex items-center gap-3 mb-6">
          <button onclick="showAuthForm('landing')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors">←</button>
          <h2 class="text-xl font-black text-slate-800">Тіркелу</h2>

        <p class="text-center text-sm text-slate-500 mt-4">Аккаунт бар ма? <button onclick="showAuthForm('login')" class="text-blue-600 font-semibold hover:underline">Кіру</button></p>
      </div>

    </div>
  </div>
</div>

<div id="main-app" style="display:none" class="min-h-screen flex flex-col">

  <!-- Top Header -->

<!-- ════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════
   DATA STORE
═══════════════════════════════════════ */
const DB = {
  get: k => { try { return JSON.parse(localStorage.getItem('sn_'+k)) || []; } catch { return []; } },
  set: (k,v) => localStorage.setItem('sn_'+k, JSON.stringify(v)),
  getOne: k => { try { return JSON.parse(localStorage.getItem('sn_'+k)); } catch { return null; } },
  setOne: (k,v) => localStorage.setItem('sn_'+k, JSON.stringify(v)),
  remove: k => localStorage.removeItem('sn_'+k),
};

/* ── Seed demo accounts ── */
(function seedDemo() {
  let users = DB.get('users');
  if (!users.find(u=>u.email==='user@demo.kz')) {
    users.push({ id:'demo-user', name:'Айгерім Сейтова', email:'user@demo.kz', password:'demo123', role:'user' });
  }
  if (!users.find(u=>u.email==='psych@demo.kz')) {
    users.push({ id:'demo-psych', name:'Д-р Алмас Бекова', email:'psych@demo.kz', password:'demo123', role:'psychologist', specialization:'Отбасылық психолог', bio:'10 жыл тәжірибе. Жұптар терапиясы, ажырасуды болдырмау бағдарламасы.', price:15000 });
  }
  DB.set('users', users);
})();

/* ═══════════════════════════════════════
   AUTH
═══════════════════════════════════════ */
function showAuthForm(form) {
  ['landing','login','register'].forEach(f => {
    document.getElementById('auth-'+f).style.display = f===form ? 'block' : 'none';
  });
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('reg-error').style.display = 'none';
}

function togglePsychFields() {
  const role = document.getElementById('reg-role').value;
  document.getElementById('psych-extra-fields').style.display = role==='psychologist' ? 'block' : 'none';
}

function doLogin() {
  const email    = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  if (!email || !password) { showErr(errEl,'Барлық өрістерді толтырыңыз'); return; }
  const users = DB.get('users');
  const user  = users.find(u => u.email===email && u.password===password);
  if (!user) { showErr(errEl,'Email немесе пароль қате'); return; }
  DB.setOne('currentUser', user);
  enterApp(user);
}

function doRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim().toLowerCase();
  const password = document.getElementById('reg-password').value;
  const role     = document.getElementById('reg-role').value;
  const errEl    = document.getElementById('reg-error');
  if (!name||!email||!password) { showErr(errEl,'Барлық өрістерді толтырыңыз'); return; }
  if (password.length<6) { showErr(errEl,'Пароль кем дегенде 6 символ болуы керек'); return; }
  const users = DB.get('users');
  if (users.find(u=>u.email===email)) { showErr(errEl,'Бұл email тіркелген'); return; }
  const newUser = { id:'u'+Date.now(), name, email, password, role };
  if (role==='psychologist') {
    newUser.specialization = document.getElementById('reg-specialization').value.trim() || 'Жалпы психолог';
    newUser.bio            = document.getElementById('reg-bio').value.trim() || '';
    newUser.price          = parseInt(document.getElementById('reg-price').value) || 0;
  }
  users.push(newUser);
  DB.set('users', users);
  DB.setOne('currentUser', newUser);
  enterApp(newUser);
}

function doLogout() {
  DB.remove('currentUser');
  document.getElementById('main-app').style.display  = 'none';
  document.getElementById('auth-overlay').style.display = 'flex';
  showAuthForm('landing');
  // Reset test state
  resetTestState();
}

function showErr(el, msg) { el.textContent=msg; el.style.display='block'; }

/* ═══════════════════════════════════════
   ENTER APP
═══════════════════════════════════════ */
function enterApp(user) {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('main-app').style.display     = 'flex';
  document.getElementById('header-greeting').textContent = `Сәлем, ${user.name.split(' ')[0]}! 👋`;
  const badge = document.getElementById('header-role-badge');
  badge.className = user.role==='psychologist' ? 'role-psych' : 'role-user';
  badge.textContent = user.role==='psychologist' ? '🩺 Психолог' : '👤 Пайдаланушы';
  buildTabs(user);
  switchTab(user.role==='psychologist' ? 'home' : 'home');
}

const USER_TABS = [
  { id:'home',     icon:'🏠', label:'Главная'    },
  { id:'diag',     icon:'🧠', label:'Диагностика'},
  { id:'shezhire', icon:'🧬', label:'Шежіре'     },
  { id:'results',  icon:'📊', label:'Нәтижелер'  },
  { id:'psychs',   icon:'👨‍⚕️', label:'Психологи' },
  { id:'profile',  icon:'👤', label:'Профиль'    },
];
const PSYCH_TABS = [
  { id:'home',     icon:'🏠', label:'Главная' },
  { id:'requests', icon:'📥', label:'Запросы' },
  { id:'profile',  icon:'👤', label:'Профиль' },
];

function buildTabs(user) {
  const tabs    = user.role==='psychologist' ? PSYCH_TABS : USER_TABS;
  const barEl   = document.getElementById('tab-bar-inner');
  const contEl  = document.getElementById('tab-contents');
  barEl.innerHTML  = '';
  contEl.innerHTML = '';
  tabs.forEach(t => {
    // Button
    const btn = document.createElement('button');
    btn.className  = 'tab-btn';
    btn.id         = 'tab-btn-'+t.id;
    btn.innerHTML  = `<span class="tab-icon">${t.icon}</span><span>${t.label}</span>`;
    btn.onclick    = () => switchTab(t.id);
    barEl.appendChild(btn);
    // Content
    const div = document.createElement('div');
    div.className = 'tab-content';
    div.id        = 'tab-'+t.id;
    div.innerHTML = buildTabContent(t.id, user);
    contEl.appendChild(div);
  });
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const btn  = document.getElementById('tab-btn-'+id);
  const cont = document.getElementById('tab-'+id);
  if (btn)  btn.classList.add('active');
  if (cont) { cont.classList.add('active'); onTabActivate(id); }
}

function onTabActivate(id) {
  const u = DB.getOne('currentUser');
  if (id==='results')  renderResultsTab();
  if (id==='psychs')   renderPsychsTab();
  if (id==='requests') renderRequestsTab();
  if (id==='profile')  renderProfileTab(u);
  if (id==='home')     renderHomeTab(u);
  if (id==='shezhire') renderShezhireTab();
}

/* ═══════════════════════════════════════
   TAB CONTENT BUILDERS
═══════════════════════════════════════ */
function buildTabContent(id, user) {
  switch(id) {
    case 'home':     return '<div id="home-inner"></div>';
    case 'diag':     return buildDiagTab();
    case 'shezhire': return '<div id="shezhire-inner"></div>';
    case 'results':  return '<div id="results-inner"></div>';
    case 'psychs':   return '<div id="psychs-inner"></div>';
    case 'requests': return '<div id="requests-inner"></div>';
    case 'profile':  return '<div id="profile-inner"></div>';
    default: return '';
  }
}

function initDiag() {

function renderCatQuestions(catIdx) {
  testState.currentCat = catIdx;
  const key    = CAT_KEYS[catIdx];
  const cat    = QUESTIONS[key];
  const area   = document.getElementById('question-area');
  if (!area) return;

  document.getElementById('cat-label-display').textContent = `${cat.label} — ${catIdx+1}/4 категория`;
  document.getElementById('diag-back-btn').style.display  = catIdx>0 ? 'block' : 'none';
  document.getElementById('diag-next-btn').textContent     = catIdx<3 ? 'Келесі →' : 'Нәтижені көру';
  updateCatProgress(catIdx);
  checkCatComplete(catIdx);

  area.innerHTML = `
    <div class="animate-fadeInUp space-y-4">
      <div class="card-flat p-4 mb-2 flex items-center gap-3">
        <div class="text-2xl">${cat.label.split(' ')[0]}</div>
        <div>
          <div class="font-bold text-slate-700">${cat.label}</div>
          <div class="text-xs text-slate-400">5 сұраққа жауап беріңіз (1–5 шкала)</div>
        </div>
      </div>
      <div class="flex justify-between text-xs text-slate-400 font-medium px-1">
        <span>1 — Мүлдем келіспеймін</span>
        <span>5 — Толық келісемін</span>
      </div>
      ${cat.questions.map((q,qi)=>`
        <div class="card p-4">
          <p class="text-sm font-medium text-slate-700 mb-3 leading-relaxed">
            <span class="text-blue-600 font-bold">${qi+1}.</span> ${q}
          </p>
          <div class="flex justify-center gap-2" id="qopts-${key}-${qi}">
            ${[1,2,3,4,5].map(v=>`
              <button class="likert-btn ${testState.answers[key][qi]===v?'selected':''}"
                      onclick="selectQ('${key}',${qi},${v})">${v}</button>`).join('')}
          </div>
        </div>`).join('')}
    </div>`;
}

function selectQ(catKey, qi, val) {
  testState.answers[catKey][qi] = val;
  document.querySelectorAll(`#qopts-${catKey}-${qi} .likert-btn`).forEach((b,i)=>{
    b.classList.toggle('selected', i+1===val);
  });
  const catIdx = CAT_KEYS.indexOf(catKey);
  updateCatProgress(catIdx);
  checkCatComplete(catIdx);
}

function updateCatProgress(catIdx) {
  const key      = CAT_KEYS[catIdx];
  const answered = Object.keys(testState.answers[key]).length;
  const pct      = (answered/5)*100;
  document.getElementById('cat-pbar').style.width = pct+'%';
  document.getElementById('cat-q-count').textContent = `${answered} / 5 сұраққа жауап берілді`;
  document.getElementById(`step-fill-${catIdx}`).style.width = pct+'%';
}

function checkCatComplete(catIdx) {
  const key = CAT_KEYS[catIdx];
  const ok  = Object.keys(testState.answers[key]).length === 5;
  document.getElementById('diag-next-btn').disabled = !ok;
}

function diagNav(dir) {
  const next = testState.currentCat + dir;
  if (next < 0) return;
  if (next > 3) {
    // Show finance tool or finish
    document.getElementById('diag-test-view').style.display    = 'none';
    document.getElementById('diag-finance-tool').style.display = 'block';
    updateFCThreshold(150000);
    return;
  }
  renderCatQuestions(next);
}

function showTestView() {
  document.getElementById('diag-test-view').style.display    = 'block';
  document.getElementById('diag-finance-tool').style.display = 'none';
  renderCatQuestions(3);
}

function updateFCThreshold(val) {
  document.getElementById('fc-threshold').value = val;
  document.getElementById('fc-threshold-display').textContent = fmtKZT(val)+' ₸';
  const slider = document.getElementById('fc-threshold');
  const pct = ((val - slider.min)/(slider.max - slider.min))*100;
  slider.style.setProperty('--val', pct+'%');
  updateFCPreview();
}

function updateFCPreview() {
  const income  = parseFloat(document.getElementById('fc-income').value) || 0;
  const expense = parseFloat(document.getElementById('fc-expense').value) || 0;
  const net     = income - expense;
  const threshold = parseInt(document.getElementById('fc-threshold').value) || 150000;
  if (income > 0) {
    document.getElementById('fc-preview').style.display = 'grid';
    document.getElementById('fc-d-income').textContent  = fmtKZT(income);
    document.getElementById('fc-d-expense').textContent = fmtKZT(expense);
    const netEl = document.getElementById('fc-d-net');
    netEl.textContent = fmtKZT(net);
    netEl.className   = `text-lg font-black ${net>=0?'text-emerald-600':'text-red-500'}`;
  }
}

function finishDiag() {
  const user = DB.getOne('currentUser');
  if (!user) return;

  // Calculate scores
  const scores = {};
  CAT_KEYS.forEach(k=>{
    const vals = Object.values(testState.answers[k]);
    scores[k] = vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/(vals.length*5))*100) : 0;
  });

  // Financial bonus from calculator
  const income    = parseFloat(document.getElementById('fc-income').value) || 0;
  const expense   = parseFloat(document.getElementById('fc-expense').value) || 0;
  const threshold = parseInt(document.getElementById('fc-threshold').value) || 150000;
  let calcBonus   = null;
  if (income > 0) {
    const net   = income - expense;
    const ratio = Math.max(0, net) / Math.max(threshold, 1);
    calcBonus   = Math.min(100, Math.round(ratio*100));
    // Blend fin score with calc
    scores.fin  = Math.round(scores.fin * 0.6 + calcBonus * 0.4);
  }

  const total = Math.round((scores.comm + scores.emot + scores.vals + scores.fin) / 4);

  const result = {
    id:        'r'+Date.now(),
    userId:    user.id,
    userName:  user.name,
    date:      new Date().toLocaleDateString('ru-RU'),
    scores,
    total,
    calcBonus,
    income:    income||null,
    expense:   expense||null,
  };

  const results = DB.get('testResults');
  results.push(result);
  DB.set('testResults', results);

  showToast('✅','Нәтиже сақталды!');
  resetTestState();
  switchTab('results');
}

function idxZhuzChange(pNum) {
  const zhuz = document.getElementById('idx-p'+pNum+'-zhuz').value;
  const sel = document.getElementById('idx-p'+pNum+'-ru');
  sel.innerHTML = '<option value="">Руды таңдаңыз...</option>';
  if (zhuz && ZHUZ_DATA[zhuz]) {
    ZHUZ_DATA[zhuz].ru.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r; opt.textContent = r;
      sel.appendChild(opt);
    });
  }
  idxRuChange();
}

function idxGetRu(pNum) {
  const sel = (document.getElementById('idx-p'+pNum+'-ru')?.value || '').trim();
  const cus = (document.getElementById('idx-p'+pNum+'-ru-custom')?.value || '').trim();
  return cus || sel;
}

function idxNormRu(str) {
  return (str||'').toLowerCase()
    .replace(/^әлімұлы\s*-\s*/i,'')
    .replace(/^байұлы\s*-\s*/i,'')
    .replace(/^жетіру\s*-\s*/i,'')
    .trim();
}

function idxRuChange() {
  const r1 = idxGetRu(1);
  const r2 = idxGetRu(2);
  const vBox = document.getElementById('idx-ru-verdict');
  if (!vBox) return;

  if (!r1 || !r2) {
    vBox.classList.add('hidden');
    return;
  }

  vBox.classList.remove('hidden');
  const n1 = idxNormRu(r1);
  const n2 = idxNormRu(r2);

  if (n1 === n2 && n1 !== 'басқа' && n1 !== '') {
    vBox.className = 'rounded-xl p-4 mb-5 border bg-amber-50 border-amber-200 text-amber-900 text-sm font-medium';
    vBox.innerHTML = `⚠️ <strong>Рулары бірдей («${r1}»)!</strong> Қазақ салты бойынша 7 атаны тексеру міндетті. Төменде 7 атаны енгізіп салыстырыңыз.`;
    idxToggle7Ata(true);
    idxMatch7Ata();
  } else {
    vBox.className = 'rounded-xl p-4 mb-5 border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm font-medium';
    vBox.innerHTML = `✅ <strong>Рулары әртүрлі («${r1}» & «${r2}»):</strong> Қандас туыстық қаупі жоқ. Жеті ата дәстүріне толық сәйкес!`;
  }
}

function idxToggle7Ata(forceOpen) {
  const wrap = document.getElementById('idx-7ata-wrap');
  const btn = document.getElementById('idx-toggle-ata-btn');
  if (!wrap || !btn) return;
  const isHidden = wrap.classList.contains('hidden');
  const open = forceOpen !== undefined ? forceOpen : isHidden;
  if (open) {
    wrap.classList.remove('hidden');
    btn.textContent = '– 7 ата өрістерін жасыру';
    idxMatch7Ata();
  } else {
    wrap.classList.add('hidden');
    btn.textContent = '+ 7 ата өрістерін ашу';
  }
}

function idxMatch7Ata() {
  const a1 = [], a2 = [];
  for (let i = 1; i <= 7; i++) {
    const v1 = (document.getElementById(`idx-p1-a${i}`)?.value || '').trim();
    const v2 = (document.getElementById(`idx-p2-a${i}`)?.value || '').trim();
    if (v1) a1.push({ name: v1, gen: i });
    if (v2) a2.push({ name: v2, gen: i });
  }

  const vBox = document.getElementById('idx-7ata-verdict');
  if (!vBox) return;

  if (a1.length === 0 && a2.length === 0) {
    vBox.classList.add('hidden');
    return;
  }
  vBox.classList.remove('hidden');

  let match = null;
  for (const p1 of a1) {
    for (const p2 of a2) {
      if (p1.name.toLowerCase() === p2.name.toLowerCase() && p1.name.length >= 3) {
        match = { name: p1.name, g1: p1.gen, g2: p2.gen };
        break;
      }
    }
    if (match) break;
  }

  if (match) {
    vBox.className = 'rounded-xl p-3.5 text-xs font-bold bg-red-50 border border-red-200 text-red-800';
    vBox.innerHTML = `🛑 <strong>ҚАУІП ЖОҒАРЫ:</strong> 7 ата ішінде ортақ баба табылды: «${match.name}» (Жігіттен ${match.g1}-ата, Қыздан ${match.g2}-ата). Қан араласу қаупіне байланысты некеге тыйым салынады!`;
  } else if (a1.length >= 3 && a2.length >= 3) {
    vBox.className = 'rounded-xl p-3.5 text-xs font-bold bg-emerald-50 border border-emerald-200 text-emerald-800';
    vBox.innerHTML = `✅ <strong>ЖЕТІ АТАДАН АСҚАН:</strong> 7 буын бойы ортақ ата анықталмады. Қазақ дәстүрі бойынша қыз алысуға рұқсат.`;
  } else {
    vBox.className = 'rounded-xl p-3.5 text-xs font-bold bg-blue-50 border border-blue-200 text-blue-800';
    vBox.innerHTML = `ℹ️ Ата-баба есімдері салыстырылуда. Нақты қорытынды үшін аталарды мүмкіндігінше түгел толтырыңыз.`;
  }
}

function catScoreRow(label, pct, color) {
  const colors = {blue:'bg-blue-600',pink:'bg-pink-500',purple:'bg-purple-600',green:'bg-emerald-500'};
  const texts  = {blue:'text-blue-700',pink:'text-pink-600',purple:'text-purple-700',green:'text-emerald-700'};
  return `
    <div>
      <div class="flex justify-between text-xs font-semibold mb-1">
        <span class="text-slate-600">${label}</span>
        <span class="${texts[color]||'text-blue-700'}">${pct}%</span>
      </div>
      <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full ${colors[color]||'bg-blue-600'} transition-all duration-1000" style="width:${pct}%"></div>
      </div>
    </div>`;
}

function riskBadge(score) {
  if (score>80) return `<span class="risk-low">🟢 Жоғары</span>`;
  if (score>=50) return `<span class="risk-med">🟡 Орташа</span>`;
  return `<span class="risk-high">🔴 Тәуекел</span>`;
}

function recCard(score) {
  let cls, icon, title, body;
  if (score>80) {
    cls='rec-high'; icon='🎉';
    title='Дайындық деңгейі жоғары. Некеге дайынсыз!';
    body='Психологиялық және қаржылық дайындығыңыз жоғары. Ашық диалог сақтаңыз.';
  } else if (score>=50) {
    cls='rec-med'; icon='⚠️';
    title='Орташа деңгей. Медиация курсы ұсынылады.';
    body='Кейбір салаларда жұмыс жасау қажет. Психолог кеңесі немесе медиация курсы ұсынылады.';
  } else {
    cls='rec-low'; icon='🚨';
    title='Қауіп жоғары. Кеңес алу қажет!';
    body='Психолог пен қаржылық кеңесшінің консультациясы алдында некеге кіруге асықпаңыз.';
  }
  return `<div class="${cls} rounded-2xl p-4 mt-4 flex gap-3"><div class="text-2xl shrink-0">${icon}</div><div><div class="font-bold text-slate-800 mb-1">${title}</div><div class="text-sm text-slate-700">${body}</div></div></div>`;
}

  const myResults = DB.get('testResults').filter(r=>r.userId===user.id);
  const hasResult = myResults.length > 0;

  el.innerHTML = `
    <div class="animate-fadeInUp space-y-5">
      <h2 class="font-black text-slate-800 text-xl">👨‍⚕️ Психологтар</h2>
      ${!hasResult?`<div class="card p-5 bg-yellow-50 border-yellow-200 text-center">
        <div class="text-3xl mb-2">⚠️</div>

        psychs.map(p=>{

          return `
            <div class="card p-5">
              <div class="flex items-start gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-400 flex items-center justify-center text-white text-xl font-black shrink-0">${p.name[0]}</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <div class="font-bold text-slate-800">${p.name}</div>
                    <span class="role-psych">🩺 Психолог</span>
                  </div>
                  <div class="text-sm text-blue-600 font-medium mt-0.5">${p.specialization||'Жалпы психолог'}</div>
                  ${p.bio?`<p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${p.bio}</p>`:''}
                  ${p.price?`<div class="text-sm font-bold text-emerald-700 mt-2">💰 ${fmtKZT(p.price)} ₸ / сессия</div>`:''}
                </div>
              </div>
              <div class="mt-4 pt-4 border-t border-slate-100">
                ${resp?`
                  <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 mb-3">
                    <div class="text-xs font-bold text-emerald-700 mb-1">✅ Психолог жауабы:</div>
                    <p class="text-sm text-emerald-800 leading-relaxed">${resp.feedback}</p>
                    ${resp.price?`<div class="text-xs font-bold text-emerald-700 mt-1">💰 ${fmtKZT(resp.price)} ₸/сессия</div>`:''}
                  </div>`:''}
                ${myReq?`
                  <div class="flex items-center gap-2 text-sm text-slate-500">
                    <span class="${resp?'text-emerald-600':'text-orange-500'} font-semibold">${resp?'✅ Жауап берілді':'⏳ Жауапты күтуде...'}</span>
                  </div>`:
                  hasResult?`<button class="btn-primary btn-sm w-full" onclick="sendRequest('${p.id}')">📤 Сұрау жіберу</button>`:
                  `<button class="btn-ghost btn-sm w-full" disabled>Алдымен диагностика өтіңіз</button>`}
              </div>
            </div>`;}).join('')}

}

function sendRequest(psychId) {
  const user    = DB.getOne('currentUser');
  const results = DB.get('testResults').filter(r=>r.userId===user.id);
  if (!results.length) { showToast('⚠️','Алдымен диагностика өтіңіз!'); return; }
  const latest   = results[results.length-1];
  const requests = DB.get('requests');
  if (requests.find(r=>r.userId===user.id&&r.psychId===psychId)) { showToast('ℹ️','Сіз бұрын сұрау жібердіңіз'); return; }
  requests.push({ id:'req'+Date.now(), userId:user.id, userName:user.name, psychId, result:latest, date:new Date().toLocaleDateString('ru-RU'), responded:false });
  DB.set('requests', requests);
  showToast('✅','Сұрау жіберілді!');
  renderPsychsTab();
}

        requests.map(req=>{

            <div class="card p-5" id="req-card-${req.id}">
              <div class="flex items-start justify-between gap-3 mb-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center text-white font-bold text-sm">${req.userName[0]}</div>
                  <div>
                    <div class="font-bold text-slate-800">${req.userName}</div>
                    <div class="text-xs text-slate-400">${req.date}</div>

                  ${riskBadge(req.result.total)}

                </div>
              </div>

              <!-- Score breakdown -->
              <div class="grid grid-cols-2 gap-2 mb-4">

              </div>
              <div class="flex items-center justify-between mb-4">
                <span class="font-semibold text-slate-700 text-sm">Жалпы балл:</span>
                <span class="font-black text-xl text-blue-700">${req.result.total}%</span>
              </div>

              <!-- Response form or existing response -->
              ${resp?`
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
                  <div class="text-xs font-bold text-emerald-700 mb-2">✅ Сіздің жауабыңыз (${resp.date})</div>
                  <p class="text-sm text-emerald-800 mb-2">${resp.feedback}</p>
                  ${resp.price?`<div class="text-sm font-bold text-emerald-800">💰 ${fmtKZT(resp.price)} ₸/сессия</div>`:''}
                </div>`:
                `<div class="bg-blue-50 rounded-2xl p-4 space-y-3" id="resp-form-${req.id}">
                  <div class="text-xs font-bold text-blue-700 uppercase tracking-widest">Жауап жазу</div>
                  <div>
                    <label class="inp-label">Кеңес / Фидбэк</label>
                    <textarea id="fb-${req.id}" class="inp" rows="3" placeholder="Пайдаланушыға арналған кеңес..."></textarea>
                  </div>
                  <div>
                    <label class="inp-label">Бағасы (₸ / сессия)</label>
                    <input type="number" id="pr-${req.id}" class="inp" placeholder="15000" min="0"/>
                  </div>
                  <button class="btn-green w-full py-2.5" onclick="submitResponse('${req.id}','${user.id}','${req.userId}')">📤 Жауап жіберу</button>
                </div>`}
            </div>`;}).join('')}
    </div>`;
}

function submitResponse(reqId, psychId, userId) {
  const feedback = document.getElementById(`fb-${reqId}`).value.trim();
  const price    = parseInt(document.getElementById(`pr-${reqId}`).value) || 0;
  if (!feedback) { showToast('⚠️','Кеңес жазыңыз'); return; }

  const responses = DB.get('responses');
  responses.push({ id:'resp'+Date.now(), requestId:reqId, psychId, userId, feedback, price, date:new Date().toLocaleDateString('ru-RU') });
  DB.set('responses', responses);

  // Mark request as responded
  const requests = DB.get('requests');
  const req = requests.find(r=>r.id===reqId);
  if (req) req.responded = true;
  DB.set('requests', requests);

  showToast('✅','Жауап жіберілді!');
  renderRequestsTab();
}

function savePsychProfile() {
  const user = DB.getOne('currentUser');
  if (!user) return;
  user.specialization = document.getElementById('prof-spec').value.trim();
  user.bio            = document.getElementById('prof-bio').value.trim();
  user.price          = parseInt(document.getElementById('prof-price').value) || 0;
  // Update in users list
  const users = DB.get('users');
  const idx   = users.findIndex(u=>u.id===user.id);
  if (idx>-1) users[idx] = user;
  DB.set('users', users);
  DB.setOne('currentUser', user);
  showToast('✅','Профиль сақталды!');
}

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function fmtKZT(n) { return Math.round(n).toLocaleString('ru-RU'); }

function animNum(id, from, to, dur, suffix) {
  const el    = document.getElementById(id);
  if (!el) return;
  const steps = Math.round(dur/(1000/60));
  let step = 0;
  const iv = setInterval(()=>{
    step++;
    el.textContent = Math.round(from+(to-from)*(step/steps))+suffix;
    if (step>=steps) clearInterval(iv);
  }, 1000/60);
}

let _toastTimer = null;
function showToast(icon, msg) {
  document.getElementById('toast-icon').textContent = icon;
  document.getElementById('toast-msg').textContent  = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}

function launchConfetti() {
  const colors = ['#06B6D4','#1E3A8A','#a78bfa','#34d399','#fb923c','#f472b6'];
  for (let i=0; i<60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const size  = Math.random()*8+4;
    c.style.cssText = `left:${Math.random()*100}vw;top:-20px;width:${size}px;height:${size*1.5}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*2+2}s;animation-delay:${Math.random()*.8}s;border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(c);
    c.addEventListener('animationend',()=>c.remove());
  }
}

/* ── Particles on auth screen ── */
(function(){
  const c = document.getElementById('auth-particles');
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.className='particle';
    const s=Math.random()*12+4;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*10}s;`;
    c.appendChild(p);
  }
})();
